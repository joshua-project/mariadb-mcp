# Dependabot version updates. Security updates (the PRs Dependabot opens for a
# known advisory) are switched on by the org security configuration
# "JP baseline (Dependabot)" and ignore this schedule — they open as soon as an
# advisory lands.
#
# Version updates are grouped so weekly volume stays reviewable: one PR per
# ecosystem for minor+patch, majors individually. Mirrors jp-adopt-core.

version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/]
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      base-images:
        patterns: ["*"]
